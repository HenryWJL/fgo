defaults:
  - _self_
  - task: adroit_hammer

name: train_freq_policy
task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

n_obs_steps: 2
horizon: 16
n_action_steps: 8

policy:
  _target_: fgo.policy.freq_policy.FreqPolicy
  shape_meta: ${shape_meta}
  obs_encoder:
    _target_: fgo.model.vision.pointnet_extractor.DP3Encoder
    shape_meta: ${shape_meta}
    pointcloud_encoder_cfg:
      in_channels: 3
      out_channels: 64
      use_layernorm: true
      final_norm: layernorm
    state_mlp_size: [64, 64]
    use_pc_color: false
  
  model_cfg:
    horizon: ${horizon}
    n_obs_steps: ${n_obs_steps}
    encoder_embed_dim: 512
    encoder_depth: 4
    encoder_num_heads: 8
    decoder_embed_dim: 512
    decoder_depth: 4
    decoder_num_heads: 8
    diffloss_d: 3
    diffloss_w: 1024
    num_iter: 4
    num_sampling_steps: ddim10
    diffusion_batch_mul: 1
    patch_size: 1
    use_token_mask: true
    use_loss_weight: false
  
  n_obs_steps: ${n_obs_steps}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}

ema:
  _target_: fgo.model.common.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: true
  pin_memory: true
  persistent_workers: false

val_dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: false
  pin_memory: true
  persistent_workers: false

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 3000
  gradient_accumulate_every: 1
  use_ema: true
  use_wandb: false
  rollout_every: 600
  checkpoint_every: 600
  val_every: 1
  sample_every: 5
  tqdm_interval_sec: 1.0

logging:
  project: fgo
  id: null
  name: ${name}_${task_name}_${training.seed}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  group: ${exp_name}
  mode: online
  resume: true

checkpoint:
  save_ckpt: true
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 1
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: true
  save_last_snapshot: false

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
